name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The workflow only reads the checkout; nothing here needs a writable token.
permissions:
  contents: read

jobs:
  validate:
    name: Syntax & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh curl git shellcheck openssl openssh-client age

      - name: make check
        run: make check

      - name: Prepare isolated home
        run: |
          test_home="$RUNNER_TEMP/dotfiles-home"
          mkdir -p "$test_home"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$test_home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$test_home/.local/share" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$test_home/.local/state" >> "$GITHUB_ENV"

      - name: Test installation script
        run: |
          ./install.sh --offline --no-chsh

      - name: Verify generated layout
        run: |
          test -d "$HOME/.config/zsh"
          test -L "$HOME/.config/zsh/.zshrc"
          test -L "$HOME/.config/zsh/.zshenv"
          test -L "$HOME/.config/zsh/config"
          test -L "$HOME/.config/zsh/integrations"
          test -f "$HOME/.config/zsh/local.zsh"
          test ! -L "$HOME/.config/zsh/local.zsh"
          test -L "$HOME/.zshenv"
          test -d "$HOME/.config/git"
          test -f "$HOME/.config/git/config"
          test ! -L "$HOME/.config/git/config"
          git config --file "$HOME/.config/git/config" --get-all include.path | grep -qxF "$PWD/git/config"
          test -L "$HOME/.config/git/ignore"
          test -L "$HOME/.config/mise/config.toml"
          test -L "$HOME/.config/starship.toml"
          test -L "$HOME/.config/tmux"
          test -x "$HOME/.config/tmux/copy.sh"
          test -L "$HOME/.config/alacritty"
          test -d "$HOME/.ssh/conf.d"
          test -d "$HOME/.ssh/keys/personal"

      - name: Run dotfiles doctor
        run: make doctor

      - name: Test uninstallation script
        run: |
          DOTFILES_SKIP_CHSH=1 ./uninstall.sh

      - name: Verify symlink teardown
        run: |
          ! test -L "$HOME/.config/zsh/.zshrc"
          ! test -L "$HOME/.zshenv"
          ! test -L "$HOME/.config/mise/config.toml"
          ! test -L "$HOME/.config/starship.toml"
          ! test -L "$HOME/.config/tmux"
          ! test -L "$HOME/.config/alacritty"
          # This home held nothing of its own, so nothing of ours may survive.
          ! test -e "$HOME/.config/git/config"
          ! test -e "$HOME/.config/zsh/local.zsh"
          ! test -e "$HOME/.config/git/config.local"
          ! test -e "$HOME/.ssh/config.local"
          ! test -e "$HOME/.config/zsh"
          ! test -e "$HOME/.config/git"
