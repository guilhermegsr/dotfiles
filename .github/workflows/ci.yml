name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh curl git shellcheck openssl

      - name: Static analysis with ShellCheck
        run: |
          shellcheck -x install.sh uninstall.sh backup.sh restore.sh scripts/*.sh

      - name: Validate Bash script syntax
        run: |
          bash -n install.sh uninstall.sh backup.sh restore.sh scripts/*.sh

      - name: Validate Zsh script syntax
        run: |
          for f in zsh/.zshenv zsh/.zshrc zsh/local.zsh.example zsh/config/*.zsh zsh/integrations/*.zsh; do
            zsh -n "$f"
          done

      - name: Backup and restore tests
        run: |
          ./scripts/test-backup-restore.sh

      - name: Test installation script
        run: |
          ./install.sh

      - name: Verify generated layout
        run: |
          test -d "$HOME/.config/zsh"
          test -L "$HOME/.config/zsh/.zshrc"
          test -L "$HOME/.config/zsh/.zshenv"
          test -L "$HOME/.config/zsh/config"
          test -L "$HOME/.config/zsh/integrations"
          test -f "$HOME/.config/zsh/local.zsh"
          test ! -L "$HOME/.config/zsh/local.zsh"
          test -L "$HOME/.zshenv"
          test -d "$HOME/.config/git"
          test -L "$HOME/.config/git/config"
          test -L "$HOME/.config/git/ignore"
          test -L "$HOME/.config/mise/config.toml"
          test -L "$HOME/.config/mise/mise.lock"
          test -L "$HOME/.config/tmux"
          test -L "$HOME/.config/alacritty"
          test -d "$HOME/.ssh/conf.d"
          test -d "$HOME/.ssh/keys/personal"

      - name: Test uninstallation script
        run: |
          ./uninstall.sh

      - name: Verify symlink teardown
        run: |
          ! test -L "$HOME/.config/zsh/.zshrc"
          ! test -L "$HOME/.zshenv"
          ! test -L "$HOME/.config/git/config"
          ! test -L "$HOME/.config/mise/config.toml"
          ! test -L "$HOME/.config/tmux"
          ! test -L "$HOME/.config/alacritty"
          test -f "$HOME/.config/zsh/local.zsh"
          test ! -L "$HOME/.config/zsh/local.zsh"
