name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh curl git shellcheck

      - name: Static analysis with ShellCheck
        run: |
          shellcheck install.sh uninstall.sh

      - name: Validate Bash script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Validate Zsh script syntax
        run: |
          for f in zsh/.zshenv zsh/.zshrc zsh/local.zsh.example zsh/config/*.zsh zsh/integrations/*.zsh; do
            zsh -n "$f"
          done

      - name: Test installation script
        run: |
          ./install.sh

      - name: Verify generated symlinks
        run: |
          test -L "$HOME/.config/zsh"
          test -L "$HOME/.zshenv"
          test -L "$HOME/.config/git"
          test -L "$HOME/.config/mise/config.toml"
          test -L "$HOME/.config/tmux"
          test -L "$HOME/.config/alacritty"

      - name: Test uninstallation script
        run: |
          ./uninstall.sh

      - name: Verify symlink teardown
        run: |
          ! test -L "$HOME/.config/zsh"
          ! test -L "$HOME/.zshenv"
          ! test -L "$HOME/.config/git"
          ! test -L "$HOME/.config/mise/config.toml"
          ! test -L "$HOME/.config/tmux"
          ! test -L "$HOME/.config/alacritty"
