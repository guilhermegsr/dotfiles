# 24-bit TrueColor and terminal capability overrides
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape delay to zero for instant mode-switching in Neovim/Vim
set -s escape-time 0
set -g mouse on
set -g history-limit 50000
set -g focus-events on

set -g prefix C-b
bind C-b send-prefix

# 1-based indexing for windows and panes to match physical keyboard row
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g allow-rename on

# Window creation and manual/automatic naming controls
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -p "Rename window to:" "rename-window '%%'"
bind . setw automatic-rename on \; display-message "Automatic window rename restored"

# Splits inheriting active pane working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux configuration reloaded"

# Layout orientation toggles (even horizontal / even vertical)
bind H select-layout even-horizontal
bind V select-layout even-vertical

# Pane navigation via Arrow keys
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Direct pane navigation without prefix
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Repeatable pane resizing
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Direct window switching via Alt+[1-9]
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi copy mode and system clipboard integration
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || pbcopy 2>/dev/null"

# Minimalist top status bar with bottom margin breathing room
set -g status-position top
set -g status 2
set -g status-format[1] ""
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"

set -g status-left "#[bold,fg=blue] ● #[default] "
set -g status-left-length 10

set -g status-right ""
set -g status-right-length 0

setw -g window-status-format "#[fg=colour244] #I #W "
setw -g window-status-current-format "#[bold,fg=white,bg=colour237] #I #W #[default]"

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour244"
