# Languages pin the series that gates breaking changes; crossing a pin is a
# deliberate edit. See README for how versions move.
[tools]
bun = "1"
go = "1.27"
java = "25"
node = "26"
python = "3.14"
# No major past 1.x; equivalent to "latest", written out to show the intent.
rust = "1"
# Pre-1.0 and fast-moving; a pin would need bumping every few weeks.
uv = "latest"

# Rolling; the release-age quarantine below is what guards these.
age = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
ripgrep = "latest"
shellcheck = "latest"
starship = "latest"
tmux = "latest"
zoxide = "latest"
ffmpeg = "latest"

[settings]
legacy_version_file = true
lockfile = false
locked = false
minimum_release_age = "7d"
# Without this, probing a tool from .zshrc silently downloads and installs it:
# opening a terminal is not a request to provision the machine. `mise install`
# is. It also keeps `install.sh --offline` honest once the shell starts.
not_found_auto_install = false
